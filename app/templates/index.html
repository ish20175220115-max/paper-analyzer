{% extends "base.html" %}
{% block title %}论文列表 - 个人论文分析管理智能体{% endblock %}

{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
  <a href="/upload" class="btn btn-outline">← 返回上传页</a>
  <h2 style="font-size:1.05rem;font-weight:600;margin:0;">📚 分析报告列表</h2>
  <a href="/upload" class="btn btn-primary">＋ 新建分析</a>
</div>

<div id="report-list-container">
  <div class="loading">
    <div class="spinner"></div>
    <span>加载中...</span>
  </div>
</div>

<div id="empty-state" class="empty-state" style="display:none;">
  <h3>还没有分析报告</h3>
  <p>点击「新建分析」开始你的第一篇论文分析。</p>
</div>

{% endblock %}

{% block scripts %}
<script>
async function loadReports() {
  const container = document.getElementById('report-list-container');
  const emptyState = document.getElementById('empty-state');

  try {
    const res = await fetch('/api/reports');
    if (!res.ok) throw new Error('加载失败');
    const data = await res.json();

    if (data.reports.length === 0) {
      container.style.display = 'none';
      emptyState.style.display = 'block';
      return;
    }

    const html = `<ul class="report-list card">${data.reports.map(r => `
      <li>
        <div style="flex:1;min-width:0;">
          <div class="report-title">
            <a href="/report/${r.id}" style="color:inherit;text-decoration:none;">${escapeHtml(r.paper_title)}</a>
          </div>
          <div class="report-meta">${r.created_at}</div>
          <div class="report-tags">${r.dimensions.map(d => `<span class="tag">${escapeHtml(d)}</span>`).join('')}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <a href="/report/${r.id}" class="btn btn-outline btn-sm">查看</a>
          <a href="/upload?edit=${r.id}" class="btn btn-outline btn-sm">编辑</a>
          <button class="btn btn-danger btn-sm" onclick="deleteReport('${r.id}', '${escapeHtml(r.paper_title)}')">删除</button>
        </div>
      </li>
    `).join('')}</ul>`;

    container.innerHTML = html;
    emptyState.style.display = 'none';
  } catch (e) {
    container.innerHTML = `<div class="error-msg">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

async function deleteReport(id, title) {
  if (!confirm(`确定要删除「${title}」吗？此操作不可撤销。`)) return;

  try {
    const res = await fetch(`/api/reports/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('删除失败');
    loadReports();  // 重新加载列表
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

loadReports();
</script>
{% endblock %}
